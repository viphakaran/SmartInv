version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: smartinv_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: smartinv_db
    ports:
      - "3306:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql
      - mysql_data:/var/lib/mysql
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: smartinv_backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/smartinv_db?useSSL=false&allowPublicKeyRetrieval=true
      - DB_USER=root
      - DB_PASS=root123
    depends_on:
      - mysql
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: smartinv_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  mysql_data:
